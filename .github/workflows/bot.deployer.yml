name: Anna The Guardian — Ping, Test & Deploy to GitHub Pages

# This workflow is intentionally long and descriptive (~300+ lines)
# - runs python ping.py (can be used to wake up a service or run a quick healthcheck)
# - runs linters, tests, security checks, build steps
# - builds a static site and deploys to GitHub Pages
# - uploads artifacts (coverage, build) for debugging
# - demonstrates matrices, caching, conditional steps, cron and manual trigger
#
# Notes for use:
# - Replace secrets placeholders (e.g. GITHUB_TOKEN, PAGES_TOKEN, SLACK_WEBHOOK) with real secrets
# - Adjust `build-site` step (mkdocs / hugo / npm) to your actual static site generator
# - ping.py should live at repo root or update the path in the `Run Ping` step

on:
  push:
    branches: [ s ]
  pull_request:
    branches: [ s ]
  workflow_dispatch:
    inputs:
      run-ping:
        description: 'Run ping.py during manual dispatch?'
        required: false
        default: 'true'
      deploy:
        description: 'Deploy built site to GitHub Pages?'
        required: false
        default: 'true'
  schedule:
    # nightly and every 6 hours to keep pages and services warm
    - cron: '0 3 * * *'        # daily at 03:00 UTC
    - cron: '0 */6 * * *'      # every 6 hours

concurrency:
  group: anna-guardian-deploy-${{ github.ref }}
  cancel-in-progress: true

# Global defaults
defaults:
  run:
    shell: bash
    working-directory: ./

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
  BUILD_DIR: public
  SITE_BASEURL: '/'

# Reusable named steps (for readability in many jobs)
# (Note: GitHub Actions does not support real "macros" here, we just show repeated step blocks below.)

jobs:
  prepare:
    name: 🧰 Prepare environment (checkout, cache, secrets)
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.python-version.outputs.python-version }}
      node-version: ${{ steps.node-version.outputs.node-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        id: python-version
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Setup Node
        id: node-version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache - pip wheelhouse
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ${{ env.PIP_CACHE_DIR }}
          key: pip-cache-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            pip-cache-${{ runner.os }}-

      - name: Cache - npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Save prepared toolchain versions
        run: |
          echo "python_version=$(python --version 2>&1)" >> $GITHUB_OUTPUT
          echo "node_version=$(node --version 2>&1)" >> $GITHUB_OUTPUT

  lint-and-test:
    name: 🧪Lint & Test (matrix: linux + macos) — fast checks
    needs: prepare
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: [3.11, 3.10]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (matrix)
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies (pip) — requirements-dev
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run flake8 (if installed)
        run: |
          if command -v flake8 >/dev/null 2>&1; then
            flake8 . || true
          else
            echo 'flake8 not installed; skipping'
          fi

      - name: Run pytest (if tests present)
        run: |
          if [ -d tests ] || ls | grep -E "test_.*\.py|.*_test\.py" >/dev/null 2>&1; then
            pytest -q --maxfail=1 || true
          else
            echo 'No pytest tests detected; skipping'
          fi

      - name: Upload small logs artifact (lint/test)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-test-logs-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .pytest_cache || true
            .coverage || true
            pytest-report.xml || true

  security-scan:
    name: 🔒 Security & dependency scan
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety (if requirements exist)
        run: |
          python -m pip install safety || true
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || true
          fi

      - name: Run safety check
        run: |
          if command -v safety >/dev/null 2>&1; then
            safety check -r requirements.txt || true
          else
            echo 'safety not available; skipping'
          fi

      - name: Node audit (if package.json present)
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high || true
          else
            echo 'no package.json; skipping npm audit'
          fi

  python-ping:
    name: 🏓 Run ping.py (healthcheck / wake)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install minimal runtime deps for ping.py
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-ping.txt ]; then
            pip install -r requirements-ping.txt
          elif [ -f requirements.txt ]; then
            # attempt to install only packages needed for ping
            pip install -r requirements.txt || true
          fi

      - name: Run ping.py (single-run)
        id: run-ping
        run: |
          echo "--- Running ping.py ---"
          if [ -f ping.py ]; then
            python -u ping.py || echo "ping.py exited with code $?: OK to continue"
          else
            echo "ping.py not found at repo root; skipping"
          fi

      - name: Upload ping output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ping-output
          path: |
            ./ping.log || true
            ./ping-output.txt || true

  build-site:
    name: 🏗️ Build static site (node/mkdocs/hugo compatible)
    needs: [prepare, lint-and-test]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install node dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo 'No package.json detected; skipping npm install'
          fi

      - name: Optionally build a static site (npm)
        run: |
          if [ -f package.json ]; then
            if npm run | grep -q "build"; then
              echo "Running npm run build"
              npm run build --if-present || true
            else
              echo "No npm build script; skipping"
            fi
          else
            echo "No Node build step requested"
          fi

      - name: Build MkDocs site (if mkdocs.yml exists)
        run: |
          if [ -f mkdocs.yml ]; then
            python -m pip install mkdocs mkdocs-material || true
            mkdocs build -d ${{ env.BUILD_DIR }} || true
          else
            echo 'No mkdocs.yml; skipping mkdocs build'
          fi

      - name: Build Hugo site (if config.toml / config.yaml exists)
        run: |
          if [ -f config.toml ] || [ -f config.yaml ]; then
            echo 'Attempting hugo build'
            curl -sL https://github.com/gohugoio/hugo/releases/latest/download/hugo_extended_0.0.0_Linux-64bit.tar.gz >/dev/null 2>&1 || true
            # Note: replace with proper hugo install steps or use setup-hugo action
            if command -v hugo >/dev/null 2>&1; then
              hugo -d ${{ env.BUILD_DIR }} || true
            else
              echo 'hugo not available; skipping'
            fi
          else
            echo 'No hugo config detected; skipping'
          fi

      - name: Inspect build output
        run: |
          if [ -d ${{ env.BUILD_DIR }} ]; then
            echo "Build directory contents:"; ls -la ${{ env.BUILD_DIR }} || true
          else
            echo "No build directory (${{ env.BUILD_DIR }}) present"
          fi

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: ${{ env.BUILD_DIR }}

  deploy-pages:
    name: 🚀 Deploy to GitHub Pages
    needs: [build-site, python-ping]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      contents: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages-url.outputs.page_url || 'https://<your-org-or-user>.github.io/<repo>' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download site-build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: ${{ env.BUILD_DIR }}

      - name: Ensure build dir exists
        run: |
          if [ ! -d ${{ env.BUILD_DIR }} ]; then
            echo "No build found in ${{ env.BUILD_DIR }} — creating a small placeholder"
            mkdir -p ${{ env.BUILD_DIR }}
            echo "<html><body><h1>Placeholder site</h1></body></html>" > ${{ env.BUILD_DIR }}/index.html
          fi

      - name: Configure git for deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy with peaceiris/actions-gh-pages
        id: deploy-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.BUILD_DIR }}
          # options below are illustrative — adjust as needed
          keep_files: false
          publish_branch: gh-pages
          publish_dir_commit_message: "Deploy: GitHub Actions — Anna The Guardian"

      - name: Get Pages URL
        id: pages-url
        run: |
          # Attempt to construct pages url based on repo metadata
          OWNER=${{ github.repository_owner }}
          REPO=${{ github.event.repository.name || github.repository }}
          echo "page_url=https://${OWNER}.github.io/${REPO}" >> $GITHUB_OUTPUT

      - name: Notify Slack (optional)
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            payload=$(jq -n --arg text "Deployment finished: ${{ github.repository }} — ${{ github.sha }}" '{text: $text}')
            curl -s -X POST -H 'Content-type: application/json' --data "$payload" "${{ secrets.SLACK_WEBHOOK }}"
          else
            echo 'No SLACK_WEBHOOK secret configured; skipping slack notify'
          fi

  release-notes:
    name: 📝 Create release notes (draft)
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate changelog from commits
        id: changelog
        run: |
          # This is a simple changelog generator for demo purposes
          echo "# Release notes for ${{ github.sha }}" > RELEASE_NOTES.md
          git --no-pager log --format='* %s (%h)' -n 50 >> RELEASE_NOTES.md || true
          echo "Generated RELEASE_NOTES.md"

      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "deploy-${{ github.run_number }}"
          name: "Automated deploy ${{ github.run_number }}"
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.changelog.outputs.upload_url || '' }}
          asset_path: ./RELEASE_NOTES.md
          asset_name: RELEASE_NOTES.md
          asset_content_type: text/markdown

  long-running-examples:
    name: 📦 Extra jobs & demo steps (matrix, docker, caching, analysis)
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [16, 18, 20]
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (matrix)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Lint package.json (if present)
        run: |
          if [ -f package.json ]; then
            jq -r '.name,.version' package.json || true
          fi

      - name: Build docker image (optional / demo)
        run: |
          if [ -f Dockerfile ]; then
            docker build -t anna-guardian-demo:latest . || true
          else
            echo 'No Dockerfile; skipping docker build'
          fi

      - name: Run container smoke test (if image built)
        run: |
          if docker images | grep anna-guardian-demo >/dev/null 2>&1; then
            docker run --rm anna-guardian-demo:latest --version || true
          else
            echo 'docker image not found; skipping container run'
          fi

      - name: Security analysis (trivy optional)
        run: |
          if command -v trivy >/dev/null 2>&1; then
            trivy fs --exit-code 0 -q . || true
          else
            echo 'trivy not present; skipping'
          fi

  finalize:
    name: ✅ Final status & cleanup
    needs: [deploy-pages, release-notes, long-running-examples, security-scan, lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List artifacts (debug)
        run: |
          echo "Artifacts available:"
          gh run artifacts || true

      - name: Cleanup temp dirs (best-effort)
        run: |
          echo 'Cleaning temporary directories'
          rm -rf ${{ env.PIP_CACHE_DIR }} || true

      - name: Conclude
        run: |
          echo "Workflow complete for run ${{ github.run_id }} (${ { github.sha } })"

# End of workflow
# This file intentionally contains many steps, comments, and guards to be
# readable and adaptable for a complex repo such as "Anna The Guardian Theme".
# Customize the sections labeled "OPTIONAL" and provide secrets as needed.
