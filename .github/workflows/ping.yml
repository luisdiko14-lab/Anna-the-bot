name: 🏓 Ping Healthcheck — Anna Bot

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run ping.py
        run: |
          if [ -f ping.py ]; then
            python ping.py
          else
            echo "ping.py not found"
          fi

      - name: Notify Discord (optional)
        if: ${{ secrets.DISCORD_WEBHOOK_URL != 'https://discord.com/api/webhooks/1476648003396702258/xvb-jviyRPnqmjHzGYZ6hC8IJmXT1ZzDb9EDe44a9GigtkWNV4qVMTLp7KtS9zafKnG-' }}
        run: |
          curl -H "Content-Type: application/json" \
               -d '{"content": "✅ Ping executed successfully for Anna The Guardian"}' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
