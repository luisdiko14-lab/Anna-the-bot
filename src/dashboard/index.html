<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnnaBot Premium Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top right, #1e2a1e, #0f0f0f);
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #root { width: 100%; }
        .dashboard-container {
            text-align: center;
            padding: 4rem;
            background: rgba(255,255,255,0.03);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            max-width: 600px;
            margin: 0 auto;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 1rem;
        }
        .tagline {
            font-size: 1.5rem;
            margin: 2rem 0;
            color: #fff;
            font-weight: 600;
        }
        .btn-login {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #7289da, #5a7fd4);
            color: #fff;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-top: 2rem;
        }
        .btn-login:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(114, 137, 218, 0.4);
        }
        .discord-icon {
            width: 24px;
            height: 24px;
        }
        .features {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: left;
            display: inline-block;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
            font-size: 1rem;
            color: #ddd;
        }
        .feature-icon {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        const root = document.getElementById('root');
        root.innerHTML = `
            <div class="dashboard-container">
                <h1>🌿 AnnaBot</h1>
                <p class="subtitle">Premium Discord Bot</p>
                <p class="tagline">⚡ Experience the full power of nature</p>
                
                <a href="/login" class="btn-login">
                    <svg class="discord-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.317 4.37a19.8 19.8 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.211.375-.444.864-.607 1.25a18.27 18.27 0 0 0-5.487 0c-.163-.386-.395-.875-.607-1.25a.077.077 0 0 0-.079-.037A19.743 19.743 0 0 0 3.683 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 6.002 3.05a.078.078 0 0 0 .084-.028a14.975 14.975 0 0 0 1.293-2.1a.07.07 0 0 0-.038-.098a13.11 13.11 0 0 1-1.872-.892a.072.072 0 0 1-.008-.12c.125-.094.25-.194.371-.293a.075.075 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.062 0a.075.075 0 0 1 .079.009c.12.099.246.198.371.293a.072.072 0 0 1-.006.12a12.977 12.977 0 0 1-1.873.892a.07.07 0 0 0-.038.099a14.995 14.995 0 0 0 1.293 2.1a.078.078 0 0 0 .084.028a19.963 19.963 0 0 0 6.003-3.05a.082.082 0 0 0 .031-.057c.5-4.565-.838-8.535-3.549-12.047a.06.06 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-.966-2.157-2.156c0-1.193.966-2.157 2.157-2.157c1.193 0 2.156.964 2.156 2.157c0 1.19-.963 2.156-2.156 2.156zm7.975 0c-1.183 0-2.157-.966-2.157-2.156c0-1.193.966-2.157 2.157-2.157c1.193 0 2.156.964 2.156 2.157c0 1.19-.962 2.156-2.156 2.156z"/>
                    </svg>
                    Sign in with Discord
                </a>

                <div class="features">
                    <div class="feature">
                        <span class="feature-icon">⚡</span>
                        <span>76+ Discord Slash Commands</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">🛡️</span>
                        <span>Advanced Moderation Tools</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">🎮</span>
                        <span>Fun & Utility Commands</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">📊</span>
                        <span>Real-time Dashboard Stats</span>
                    </div>
                </div>
            </div>
        `;
    </script>
</body>
</html>
