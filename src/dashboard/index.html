<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnnaBot Premium Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top right, #1e2a1e, #0f0f0f);
            color: #f0f0f0;
            min-height: 100vh;
        }
        #root { padding: 3rem 1.5rem; max-width: 1100px; margin: 0 auto; }
        .dashboard-container { text-align: center; padding: 3rem; background: rgba(255,255,255,0.03); border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; background: linear-gradient(45deg, #2ecc71, #27ae60); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { font-size: 1.1rem; color: #aaa; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        // Simple React-like component rendering
        const root = document.getElementById('root');
        root.innerHTML = `
            <div class="dashboard-container">
                <h1>🌿 AnnaBot Premium</h1>
                <p>Welcome to the Forest Guardian Control Center</p>
                <p style="margin-top: 2rem; font-size: 1.5rem;">⚡ Experience the full power of nature</p>
            </div>
        `;
    </script>
</body>
</html>
