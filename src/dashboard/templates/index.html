<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnnaBot Premium Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
    <div id="root">
        <div class="dashboard">
            <header>
                <div class="brand">
                    <span class="premium-tag">PREMIUM</span>
                    <h1>🌿 AnnaBot</h1>
                </div>
                <div id="status-badge" class="badge">Checking...</div>
            </header>
            <main>
                <section class="hero">
                    <h2>Forest Guardian Control Center</h2>
                    <p>Experience the full power of nature with AnnaBot Premium.</p>
                    <form action="/create-checkout-session" method="POST">
                        <button type="submit" class="btn-premium">⚡ Upgrade to Premium — $9.99</button>
                    </form>
                </section>

                <div class="stats-grid">
                    <div class="card">
                        <div class="card-icon">⚡</div>
                        <h3>CPU Usage</h3>
                        <p id="cpu-val">--</p>
                    </div>
                    <div class="card">
                        <div class="card-icon">🧠</div>
                        <h3>RAM Usage</h3>
                        <p id="ram-val">--</p>
                    </div>
                    <div class="card">
                        <div class="card-icon">🌍</div>
                        <h3>System</h3>
                        <p id="platform-val">--</p>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
